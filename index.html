<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to 7-11 App...</title>
    <script>
        window.onload = function() {
            // เปลี่ยน YOUR_APP_STORE_ID เป็น ID ของแอป 7-11 บน App Store
            var appStoreUrl = "https://apps.apple.com/th/app/id514262377";
            window.location.replace(appStoreUrl);
        };
    </script>
</head>
<body>
    <p>กำลังพาท่านไปยัง App Store...</p>
</body>
</html>
